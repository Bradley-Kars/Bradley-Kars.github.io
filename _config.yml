about_content: |
  Hi, I’m Bradley, a seasoned Systems Administrator and IT Infrastructure Specialist passionate about engineering robust, secure system frameworks and optimizing enterprise data environments. Currently completing a Master of Science in Cybersecurity Management with a specialized focus on AWS Cloud Technologies, I combine hands-on infrastructure maintenance with hard-edged compliance standards like NIST and HIPAA. Over nearly a decade in technical operations, I have orchestrated fluid migrations, engineered fault-tolerant backup methodologies, and systematically mitigated system vulnerabilities across diverse clinical and enterprise architectures.

  I am most skilled in: <mark>Systems Administration</mark>, <mark>Cybersecurity Operations</mark>, and <mark>Cloud Migrations (AWS)</mark>

